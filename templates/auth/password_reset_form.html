{% extends "base.html" %}
{% block title %}Reset password - CONTINEX{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h2 class="text-center">Forgot your password?</h2>
  <p class="text-center text-muted">Enter your email and we'll send you a reset link.</p>
  <form method="post" class="card card-body p-4 login-form">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
    {% endfor %}
    <button class="btn btn-primary w-100">Send reset link</button>
  </form>
</div></div>
{% endblock %}
