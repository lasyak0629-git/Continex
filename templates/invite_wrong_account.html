{% extends "base.html" %}
{% block content %}
<div class="alert alert-warning">This invitation was sent to <strong>{{ inv.email }}</strong>. You are signed in as a different account. Log out and sign in (or create an account) with that email address.</div>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-primary">Log out</button></form>
{% endblock %}
