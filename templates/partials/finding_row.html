{# CONTEXT: f{id, rule_label, severity, support, message, days_after_leave, detail_url} #}
<div class="card mb-2 finding finding-{{ f.severity|lower }}" role="button"
     hx-get="{{ f.detail_url }}" hx-target="#detail" hx-swap="innerHTML">
  <div class="card-body py-2">
    <div class="d-flex justify-content-between">
      <strong>{{ f.rule_label }}</strong>
      <span>
        <span class="badge bg-{% if f.severity == 'BLOCKER' %}danger{% else %}warning text-dark{% endif %}">{{ f.severity }}</span>
        <span class="badge bg-secondary">{{ f.support }}</span>
      </span>
    </div>
    <div class="small">{{ f.message }}</div>
    {% if f.days_after_leave is not None %}
      <div class="small text-danger">{{ f.days_after_leave }} days after the person leaves</div>
    {% endif %}
  </div>
</div>
