{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-6">
  <div class="card p-4 text-center">
  {% if ok %}
    <h2>Email confirmed</h2><p class="text-muted">You can now create projects and join invitations.</p>
    <a class="btn btn-primary" href="{% url 'home' %}">Go to projects</a>
  {% else %}
    <h2>This link doesn't work</h2><p class="text-muted">It may have expired or been changed. Log in and request a new one.</p>
    <a class="btn btn-primary" href="{% url 'verify_notice' %}">Request a new link</a>
  {% endif %}
  </div>
</div></div>
{% endblock %}
