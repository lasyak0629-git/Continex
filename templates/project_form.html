{% extends "base.html" %}
{% block title %}New project - CONTINEX{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8 col-lg-6">
  <h2>Start a handover</h2>
  <p class="text-muted">You will be the manager. Next you can invite the leaving person and the newcomer.</p>
  <form method="post" class="card card-body p-4 login-form">
    {% csrf_token %}
    {% for f in form %}
      <div class="mb-3"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{{ f.errors }}</div>
    {% endfor %}
    <button class="btn btn-primary w-100">Create project</button>
  </form>
</div></div>
{% endblock %}
